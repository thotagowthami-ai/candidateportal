name: Backend Post-Deploy API Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Build Trigger TXT"]
    types: [completed]

concurrency:
  group: backend-postdeploy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman-tests:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman

      - name: Prepare CI Postman environment
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          POSTMAN_AUTH_EMAIL: ${{ secrets.POSTMAN_AUTH_EMAIL }}
          POSTMAN_AUTH_PASSWORD: ${{ secrets.POSTMAN_AUTH_PASSWORD }}
        run: |
          cp postman/CandidatePortal.postman_environment.json postman/ci.environment.json
          node - <<'NODE'
          const fs = require("fs");
          const path = "postman/ci.environment.json";
          const env = JSON.parse(fs.readFileSync(path, "utf8"));
          const valueMap = new Map(env.values.map((v) => [v.key, v]));

          const setValue = (key, value) => {
            const item = valueMap.get(key);
            if (item) item.value = value;
          };

          setValue("base_url", process.env.BACKEND_BASE_URL || "https://cportal-production.up.railway.app");
          setValue("auth_email", process.env.POSTMAN_AUTH_EMAIL || "");
          setValue("auth_password", process.env.POSTMAN_AUTH_PASSWORD || "");

          fs.writeFileSync(path, JSON.stringify(env, null, 2));
          NODE

      - name: Run Smoke Folder
        run: |
          newman run postman/CandidatePortal.postman_collection.json \
            -e postman/ci.environment.json \
            --folder "00 - Smoke" \
            --reporters cli,junit \
            --reporter-junit-export postman/newman-smoke.xml

      - name: Run Auth Folder (optional)
        env:
          POSTMAN_AUTH_EMAIL: ${{ secrets.POSTMAN_AUTH_EMAIL }}
          POSTMAN_AUTH_PASSWORD: ${{ secrets.POSTMAN_AUTH_PASSWORD }}
        run: |
          if [ -z "$POSTMAN_AUTH_EMAIL" ] || [ -z "$POSTMAN_AUTH_PASSWORD" ]; then
            echo "Skipping auth tests. Configure POSTMAN_AUTH_EMAIL and POSTMAN_AUTH_PASSWORD secrets to enable them."
            exit 0
          fi

          newman run postman/CandidatePortal.postman_collection.json \
            -e postman/ci.environment.json \
            --folder "01 - Auth" \
            --reporters cli,junit \
            --reporter-junit-export postman/newman-auth.xml

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: |
            postman/newman-smoke.xml
            postman/newman-auth.xml
